name: My First Workflow

on: [push]

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: First Job Step
        run: echo "Hello from first job"

  say_bye:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Wait 2 seconds
        run: sleep 2

      - name: Print Goodbye
        run: echo "Goodbye from second job"
